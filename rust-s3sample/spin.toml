#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "s3sample"
version = "0.1.0"
authors = ["Eric Debeij <hdebeij@akamai.com>"]
description = ""

[variables]
s3_access_key = { required = true }
s3_secret_key = { required = true, secret = true }
s3_region = { default = "nl-ams-1" }
s3_endpoint = { default = "nl-ams-1.linodeobjects.com" }
s3_bucket = { required = true }

[[trigger.http]]
route = "/storage/..."
component = "s3sample"

[component.s3sample]
source = "target/wasm32-wasip2/release/s3sample.wasm"
allowed_outbound_hosts = ["https://{{ s3_bucket }}.{{ s3_endpoint }}"]

[component.s3sample.variables]
s3_access_key = "{{ s3_access_key }}"
s3_secret_key = "{{ s3_secret_key }}"
s3_region = "{{ s3_region }}"
s3_endpoint = "{{ s3_endpoint }}"
s3_bucket = "{{ s3_bucket }}"

[component.s3sample.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]

